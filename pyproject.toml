[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cavsqueeze"
version = "1.10.0"
description = "Beyond-mean-field cavity-mediated spin squeezing for solid-state clock-transition ensembles"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
  {name = "Tanvir Mahmud Mahim", email = "tanvir.mahim@bracu.ac.bd"},
]
keywords = ["spin squeezing", "cavity QED", "cumulant expansion", "one-axis twisting", "rare-earth ions", "quantum metrology"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/TaN-MM-Org/cavsqueeze"
Issues = "https://github.com/TaN-MM-Org/cavsqueeze/issues"
Paper-Companion-Repository = "https://github.com/Tanvir-Mahmud-Mahim/yb-cawo4-cavity-squeezing"

[project.optional-dependencies]
exact = ["qutip>=5.0"]
test = ["pytest", "qutip>=5.0"]

[tool.setuptools]
packages = ["cavsqueeze"]
