name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run the test suite
        run: pytest tests -q

  core-future:
    # the QuTiP-free core (QuTiP is optional) must run on the newest
    # Python without the exact-reference extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install core only (no QuTiP) and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run the QuTiP-free test suite (exact-reference tests skip)
        run: pytest -q

  oldest-dependencies:
    # the lowest versions pyproject.toml allows (QuTiP 5.0.0 imports
    # setuptools at run time, so it is installed explicitly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the oldest allowed dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.24.0" "scipy==1.10.0" "matplotlib==3.7.0" "qutip==5.0.0" setuptools pytest
          pip install --no-deps -e .
      - name: Run the test suite
        run: pytest tests -q
