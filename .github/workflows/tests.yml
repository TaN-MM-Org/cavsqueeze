name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run the test suite
        run: pytest tests -q

  core-future:
    # future-proofing: the QuTiP-free core must already run on the
    # newest Python, ahead of upstream wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install core only (no QuTiP) and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run the QuTiP-free test suite (exact-reference tests skip)
        run: pytest -q
